<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Innovakit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/admin.css">
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <!-- LOGO DE IMAGEN AQUÍ -->
      <div style="text-align: center; margin-bottom: 24px;">
        <img src="assets/img/logo-innovakit.png" alt="Innovakit" style="height: 50px;" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'logo-innovakit\' style=\'font-size:2rem\'><span class=\'logo-innovakit__in\'>Inn</span><span class=\'logo-innovakit__no\'>o</span><span class=\'logo-innovakit__va\'>va</span><span class=\'logo-innovakit__kit\'>kit</span></span>';">
      </div>
      <p style="text-align: center; color: #64748b; margin-bottom: 32px;">Panel de Administración</p>
      
      <div id="login-error" style="display: none; margin-bottom: 16px; padding: 12px; background: #fee2e2; color: #b91c1c; border-radius: 8px; font-size: 0.9rem;"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="admin-email" class="form-input" placeholder="admin@innovakit.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 8px;">Ingresar al Panel</button>
      </form>
      
      <div style="text-align: center; margin-top: 24px;">
        <a href="index.html" class="btn" style="background: #f1f5f9; color: #475569; width: 100%; padding: 12px;"><i class="fas fa-arrow-left"></i> Volver a la tienda</a>
      </div>
    </div>
  </div>

  <!-- PANEL ADMIN -->
  <div id="admin-panel" class="admin-layout" style="display: none;">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <!-- LOGO DE IMAGEN AQUÍ TAMBIÉN -->
        <img src="assets/img/logo-innovakit.png" alt="Innovakit" style="height: 40px; margin-bottom: 8px;" onerror="this.style.display='none'; this.parentElement.innerHTML='<h1 class=\'logo-innovakit\' style=\'font-size:1.8rem\'><span class=\'logo-innovakit__in\'>Inn</span><span class=\'logo-innovakit__no\'>o</span><span class=\'logo-innovakit__va\'>va</span><span class=\'logo-innovakit__kit\'>kit</span></h1>';">
        <p>Panel Admin</p>
      </div>
      
      <nav class="sidebar-nav">
        <button onclick="cargarDashboard()" id="nav-dashboard" class="nav-item active"><i class="fas fa-chart-pie"></i> Dashboard</button>
        <button onclick="cargarProductos()" id="nav-productos" class="nav-item"><i class="fas fa-microchip"></i> Productos</button>
        <button onclick="cargarKits()" id="nav-kits" class="nav-item"><i class="fas fa-box"></i> Kits</button>
        <button onclick="cargarCategorias()" id="nav-categorias" class="nav-item"><i class="fas fa-tags"></i> Categorías</button>
        <button onclick="cargarReviews()" id="nav-reviews" class="nav-item"><i class="fas fa-star"></i> Reviews</button>
        <button onclick="cargarPedidos()" id="nav-pedidos" class="nav-item"><i class="fas fa-shopping-bag"></i> Pedidos</button>
        <button onclick="cargarRankingSorteo()" id="nav-sorteo" class="nav-item"><i class="fas fa-trophy"></i> Ranking / Sorteo</button>
        <button onclick="cargarUsuarios()" id="nav-usuarios" class="nav-item"><i class="fas fa-users"></i> Usuarios</button>
      </nav>
      
      <div class="sidebar-footer">
        <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 12px;">
          <div style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #64748b;">
            <i class="fas fa-user"></i>
          </div>
          <div>
            <p id="admin-nombre" style="font-weight: 600; color: #1e293b; margin: 0; font-size: 0.95rem;">Admin</p>
            <p id="admin-email" style="font-size: 0.8rem; color: #64748b; margin: 0;"></p>
          </div>
        </div>
        <button onclick="cerrarSesionAdmin()" class="btn" style="width: 100%; background: #fff; border: 1px solid #e2e8f0; color: #dc2626;">
          <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </button>
      </div>
    </aside>
    
    <!-- CONTENIDO -->
    <main class="main-content">
      <div id="contenido-principal">
        <div style="text-align: center; padding: 60px;">
          <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--blue);"></i>
        </div>
      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- MODAL DE PRODUCTO -->
  <!-- ========================================== -->
  <div id="modal-producto" class="admin-modal">
    <div class="admin-modal__content">
      <div class="admin-modal__header">
        <h2 id="modal-titulo">Agregar Producto</h2>
        <button onclick="cerrarModalProducto()" style="background:#f1f5f9; border:none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor:pointer; color: #475569;"><i class="fas fa-times"></i></button>
      </div>
      
      <form id="form-producto">
        <input type="hidden" id="producto-id">
        <div class="form-group">
          <label class="form-label">Nombre del producto *</label>
          <input type="text" id="prod-nombre" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <textarea id="prod-descripcion" class="form-input" rows="3"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label class="form-label">Precio (Gs.) *</label>
            <input type="number" id="prod-precio" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Categoría</label>
            <input type="text" id="prod-categoria" class="form-input" placeholder="Ej: Sensores">
          </div>
        </div>
        
        <!-- NUEVO BLOQUE DE IMAGEN -->
        <div class="form-group">
          <label class="form-label">Imagen del producto</label>
          <!-- Input oculto donde se guarda la URL final -->
          <input type="hidden" id="prod-imagen" value="">
          
          <!-- Input para subir el archivo -->
          <input type="file" id="prod-imagen-file" class="form-input" accept="image/*" style="padding: 10px; background: #f8fafc;">
          
          <!-- Vista previa de la imagen actual o de la que se está subiendo -->
          <div id="preview-imagen" style="display: none; margin-top: 12px; text-align: center;">
            <img id="img-preview" src="" alt="Vista previa" style="max-height: 120px; border-radius: 8px; border: 1px solid #e2e8f0;">
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Imagen actual</p>
          </div>
        </div>
        <!-- FIN NUEVO BLOQUE -->

        <div class="form-group">
          <label class="form-label">Especificaciones (una por línea)</label>
          <textarea id="prod-especificaciones" class="form-input" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Componentes (solo si es Kit, uno por línea)</label>
          <textarea id="prod-componentes" class="form-input" rows="3"></textarea>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="prod-stock" checked style="width: 18px; height: 18px;">
          <label for="prod-stock" style="font-weight: 600; font-size: 0.95rem; color: #1e293b;">Producto disponible (Stock)</label>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select id="prod-tipo" class="form-input">
              <option value="componente">Componente suelto</option>
              <option value="kit">Producto de Kit</option>
            </select>
          </div>
          <div class="form-group" id="kit-id-container" style="display: none;">
            <label class="form-label">ID del Kit</label>
            <input type="number" id="prod-kit-id" class="form-input" placeholder="Ej: 1">
          </div>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 32px;">
          <button type="submit" class="btn btn-primary" style="flex: 1; padding: 14px;">Guardar Producto</button>
          <button type="button" onclick="cerrarModalProducto()" class="btn" style="flex: 1; padding: 14px; background: #f1f5f9; color: #475569;">Cancelar</button>
        </div>
      </form>

  <!-- ========================================== -->
  <!-- MODAL DE KIT (NUEVO) -->
  <!-- ========================================== -->
  <div id="modal-kit" class="admin-modal">
    <div class="admin-modal__content">
      <div class="admin-modal__header">
        <h2 id="modal-kit-titulo">Agregar Kit</h2>
        <button onclick="cerrarModalKit()" style="background:#f1f5f9; border:none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor:pointer; color: #475569;"><i class="fas fa-times"></i></button>
      </div>
      
      <form id="form-kit">
        <input type="hidden" id="kit-id">
        
        <div class="form-group">
          <label class="form-label">Nombre del Kit *</label>
          <input type="text" id="kit-nombre" class="form-input" required placeholder="Ej: Línea Acebott">
        </div>
        
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <textarea id="kit-descripcion" class="form-input" rows="4" placeholder="Describe de qué trata este kit..."></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Imagen de portada (URL/Ruta)</label>
          <input type="text" id="kit-imagen" class="form-input" placeholder="png/Acebott.svg">
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="kit-activo" checked style="width: 18px; height: 18px;">
          <label for="kit-activo" style="font-weight: 600; font-size: 0.95rem; color: #1e293b;">Kit visible en la tienda</label>
        </div>
        
        <div style="display: flex; gap: 12px; margin-top: 32px;">
          <button type="submit" class="btn btn-primary" style="flex: 1; padding: 14px;">Guardar Kit</button>
          <button type="button" onclick="cerrarModalKit()" class="btn" style="flex: 1; padding: 14px; background: #f1f5f9; color: #475569;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/config.js"></script>

  <script>
    let usuarioAdmin = null;
    let productosAdmin = [];
    let kitsAdmin = [];

    // LOGIN
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const loginBtn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('login-error');
      
      loginBtn.textContent = 'Verificando...';
      loginBtn.disabled = true;
      errorDiv.style.display = 'none';
      
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        
        const { data: perfil, error: perfilError } = await supabaseClient.from('perfiles').select('*').eq('id', data.user.id).single();
        
        if (perfilError || !perfil?.es_admin) {
          await supabaseClient.auth.signOut();
          throw new Error('No tienes permisos de administrador');
        }
        
        usuarioAdmin = { id: data.user.id, email: data.user.email, nombre: perfil.nombre };
        iniciarPanel();
      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        loginBtn.textContent = 'Ingresar al Panel';
        loginBtn.disabled = false;
      }
    });

    function iniciarPanel() {
      document.getElementById('admin-nombre').textContent = usuarioAdmin.nombre;
      document.getElementById('admin-email').textContent = usuarioAdmin.email;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'flex';
      cargarDashboard();
    }

    function cerrarSesionAdmin() {
      supabaseClient.auth.signOut();
      location.reload();
    }

    function activarNav(seccion) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById(`nav-${seccion}`)?.classList.add('active');
    }

    // DASHBOARD
    async function cargarDashboard() {
      activarNav('dashboard');
      const { count: prodCount } = await supabaseClient.from('productos').select('*', { count: 'exact', head: true });
      const { count: pedidosCount } = await supabaseClient.from('pedidos').select('*', { count: 'exact', head: true });
      const { count: reviewsCount } = await supabaseClient.from('reviews').select('*', { count: 'exact', head: true }).eq('aprobada', false);
      const { count: usuariosCount } = await supabaseClient.from('perfiles').select('*', { count: 'exact', head: true });
      
      document.getElementById('contenido-principal').innerHTML = `
        <h2 class="page-title">Resumen General</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: #eff6ff; color: #3b82f6;"><i class="fas fa-microchip"></i></div>
            <div class="stat-info"><h3>${prodCount || 0}</h3><p>Productos totales</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #fef3c7; color: #d97706;"><i class="fas fa-shopping-bag"></i></div>
            <div class="stat-info"><h3>${pedidosCount || 0}</h3><p>Pedidos recibidos</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #fef9c3; color: #ca8a04;"><i class="fas fa-star"></i></div>
            <div class="stat-info"><h3>${reviewsCount || 0}</h3><p>Reviews pendientes</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: #f3e8ff; color: #9333ea;"><i class="fas fa-users"></i></div>
            <div class="stat-info"><h3>${usuariosCount || 0}</h3><p>Usuarios registrados</p></div>
          </div>
        </div>
        <div style="background: #fff; padding: 40px; border-radius: 16px; text-align: center; border: 1px solid #e2e8f0;">
          <i class="fas fa-chart-line fa-3x" style="color: #cbd5e1; margin-bottom: 16px;"></i>
          <h3 style="color: #1e293b; margin-bottom: 8px;">¡Bienvenido, ${usuarioAdmin.nombre}!</h3>
          <p style="color: #64748b;">Seleccioná una opción del menú lateral para comenzar a gestionar tu tienda.</p>
        </div>
      `;
    }

    // PRODUCTOS
async function cargarProductos() {
  activarNav('productos');
  const { data } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
  productosAdmin = data || [];
  
  document.getElementById('contenido-principal').innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2 class="page-title" style="margin: 0;">Gestión de Productos</h2>
      <button onclick="abrirModalProducto()" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo producto</button>
    </div>
    
    <!-- BUSCADOR DE PRODUCTOS -->
    <div style="margin-bottom: 24px; position: relative;">
      <i class="fas fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
      <input type="text" id="search-admin-prod" class="form-input" placeholder="Buscar producto por nombre o categoría..." style="padding-left: 44px; font-size: 1rem;" oninput="filtrarTablaProductos()">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Tipo</th>
            <th>Estado</th> <!-- NUEVA COLUMNA -->
            <th style="text-align: right;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-productos">
          ${productosAdmin.map(p => `
            <tr class="fila-producto" data-nombre="${p.nombre.toLowerCase()}" data-categoria="${(p.categoria || '').toLowerCase()}" style="${!p.activo ? 'background-color: #f8fafc; opacity: 0.7;' : ''}">
              <td style="color: #64748b;">#${p.id}</td>
              <td style="font-weight: 600;">${p.nombre}</td>
              <td style="color: #16a34a; font-weight: 600;">${p.precio ? p.precio.toLocaleString('es-PY') : 0} Gs.</td>
              <td>${p.stock ? '<span style="color: #16a34a;"><i class="fas fa-check-circle"></i> Sí</span>' : '<span style="color: #dc2626;"><i class="fas fa-times-circle"></i> No</span>'}</td>
              <td>${p.kit_id ? `<span style="background:#e0e7ff; color:#4338ca; padding:4px 10px; border-radius:99px; font-size:0.8rem; font-weight:600;">Kit ${p.kit_id}</span>` : '<span style="background:#f1f5f9; color:#475569; padding:4px 10px; border-radius:99px; font-size:0.8rem; font-weight:600;">Suelto</span>'}</td>
              
              <!-- ESTADO (Activo / Oculto) -->
              <td>
                ${p.activo !== false 
                  ? '<span style="color: #16a34a; font-weight: 600; font-size: 0.85rem; background: #dcfce7; padding: 4px 10px; border-radius: 99px;">Activo</span>' 
                  : '<span style="color: #dc2626; font-weight: 600; font-size: 0.85rem; background: #fee2e2; padding: 4px 10px; border-radius: 99px;">Oculto</span>'}
              </td>

              <td style="text-align: right;">
                <button onclick="editarProducto(${p.id})" class="btn btn-sm btn-edit" title="Editar"><i class="fas fa-pen"></i></button>
                
                ${p.activo !== false 
                  ? `<button onclick="eliminarProducto(${p.id})" class="btn btn-sm btn-delete" title="Ocultar de la tienda"><i class="fas fa-eye-slash"></i></button>` 
                  : `<button onclick="restaurarProducto(${p.id})" class="btn btn-sm btn-approve" title="Mostrar en la tienda"><i class="fas fa-eye"></i></button>`}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

    // FUNCIÓN PARA FILTRAR LA TABLA EN TIEMPO REAL
    window.filtrarTablaProductos = function() {
      const texto = document.getElementById('search-admin-prod').value.toLowerCase();
      const filas = document.querySelectorAll('.fila-producto');
      
      filas.forEach(fila => {
        const nombre = fila.getAttribute('data-nombre');
        const categoria = fila.getAttribute('data-categoria');
        
        if (nombre.includes(texto) || categoria.includes(texto)) {
          fila.style.display = ''; // Mostrar
        } else {
          fila.style.display = 'none'; // Ocultar
        }
      });
    }

    function abrirModalProducto(producto = null) {
      document.getElementById('modal-titulo').textContent = producto ? 'Editar Producto' : 'Nuevo Producto';
      document.getElementById('producto-id').value = producto?.id || '';
      document.getElementById('prod-nombre').value = producto?.nombre || '';
      document.getElementById('prod-descripcion').value = producto?.descripcion || '';
      document.getElementById('prod-precio').value = producto?.precio || '';
      document.getElementById('prod-categoria').value = producto?.categoria || '';
      
      // Manejo de la imagen
      document.getElementById('prod-imagen').value = producto?.imagen_principal || '';
      document.getElementById('prod-imagen-file').value = ''; // Limpiamos el input de archivo
      
      const preview = document.getElementById('preview-imagen');
      const imgPreview = document.getElementById('img-preview');
      if (producto?.imagen_principal) {
        imgPreview.src = producto.imagen_principal;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }

      document.getElementById('prod-especificaciones').value = (producto?.especificaciones || []).join('\n');
      document.getElementById('prod-componentes').value = (producto?.componentes_lista || []).join('\n');
      document.getElementById('prod-stock').checked = producto?.stock !== false;
      document.getElementById('prod-tipo').value = producto?.kit_id ? 'kit' : 'componente';
      document.getElementById('prod-kit-id').value = producto?.kit_id || '';
      
      toggleKitId();
      document.getElementById('modal-producto').classList.add('is-open');
    }

    function cerrarModalProducto() {
      document.getElementById('modal-producto').classList.remove('is-open');
      document.getElementById('form-producto').reset();
    }

    function toggleKitId() {
      const tipo = document.getElementById('prod-tipo').value;
      document.getElementById('kit-id-container').style.display = tipo === 'kit' ? 'block' : 'none';
    }
    document.getElementById('prod-tipo').addEventListener('change', toggleKitId);

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const textoOriginal = submitBtn.innerHTML;
      
      const id = document.getElementById('producto-id').value;
      const tipo = document.getElementById('prod-tipo').value;
      const fileInput = document.getElementById('prod-imagen-file');
      let urlImagen = document.getElementById('prod-imagen').value; // URL actual
      
      // 1. Si el usuario seleccionó un archivo nuevo, lo subimos a Supabase
      if (fileInput.files.length > 0) {
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo imagen...';
        submitBtn.disabled = true;
        
        const file = fileInput.files[0];
        // Generamos un nombre único para evitar que se sobrescriban (ej: 1698765-arduino.webp)
        const nombreArchivo = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
        
        const { data, error } = await supabaseClient.storage
          .from('imagenes')
          .upload(nombreArchivo, file);
          
        if (error) {
          alert('Error al subir imagen: ' + error.message);
          submitBtn.innerHTML = textoOriginal;
          submitBtn.disabled = false;
          return;
        }
        
        // Obtenemos la URL pública de la imagen recién subida
        const { data: urlData } = supabaseClient.storage
          .from('imagenes')
          .getPublicUrl(nombreArchivo);
          
        urlImagen = urlData.publicUrl;
      }

      // 2. Preparamos los datos para guardar en la tabla
      const data = {
        nombre: document.getElementById('prod-nombre').value,
        descripcion: document.getElementById('prod-descripcion').value,
        precio: parseInt(document.getElementById('prod-precio').value),
        categoria: document.getElementById('prod-categoria').value,
        imagen_principal: urlImagen,
        especificaciones: document.getElementById('prod-especificaciones').value.split('\n').filter(s => s.trim()),
        componentes_lista: document.getElementById('prod-componentes').value.split('\n').filter(s => s.trim()),
        stock: document.getElementById('prod-stock').checked,
        activo: true,
        kit_id: tipo === 'kit' ? parseInt(document.getElementById('prod-kit-id').value) : null
      };
      
      // 3. Guardamos o actualizamos
      if (id) {
        await supabaseClient.from('productos').update(data).eq('id', id);
      } else {
        await supabaseClient.from('productos').insert([data]);
      }
      
      // Restauramos el botón y recargamos la tabla
      submitBtn.innerHTML = textoOriginal;
      submitBtn.disabled = false;
      cerrarModalProducto();
      cargarProductos();
    });

    async function editarProducto(id) { abrirModalProducto(productosAdmin.find(p => p.id === id)); }

// ELIMINAR (Ocultar) PRODUCTO
// ==========================================
async function eliminarProducto(id) {
    const result = await Swal.fire({
        title: '¿Ocultar producto?',
        text: "El producto dejará de ser visible en la tienda, pero no se borrará de la base de datos.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Sí, ocultar',
        cancelButtonText: 'Cancelar'
    });

    if (result.isConfirmed) {
        const { error } = await supabaseClient
            .from('productos')
            .update({ activo: false })
            .eq('id', id);

        if (error) {
            Swal.fire('Error', 'No se pudo ocultar: ' + error.message, 'error');
            console.error(error);
        } else {
            Swal.fire('Oculto', 'El producto ya no es visible en la tienda.', 'success');
            cargarProductos(); // Recarga la tabla para ver el cambio de estado
        }
    }
}

// RESTAURAR (Mostrar) PRODUCTO

async function restaurarProducto(id) {
    const result = await Swal.fire({
        title: '¿Mostrar producto?',
        text: "El producto volverá a ser visible en la tienda.",
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#16a34a',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Sí, mostrar',
        cancelButtonText: 'Cancelar'
    });

    if (result.isConfirmed) {
        const { error } = await supabaseClient
            .from('productos')
            .update({ activo: true })
            .eq('id', id);

        if (error) {
            Swal.fire('Error', 'No se pudo restaurar: ' + error.message, 'error');
            console.error(error);
        } else {
            Swal.fire('Restaurado', 'El producto vuelve a estar visible.', 'success');
            cargarProductos();
        }
    }

        </div>
        
        <!-- BUSCADOR DE KITS -->
        <div style="margin-bottom: 24px; position: relative;">
          <i class="fas fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>

            </tbody>
          </table>

      `;

    // FUNCIÓN PARA FILTRAR LA TABLA DE KITS EN TIEMPO REAL
    window.filtrarTablaKits = function() {
      const texto = document.getElementById('search-admin-kit').value.toLowerCase();
      const filas = document.querySelectorAll('.fila-kit');
      
      filas.forEach(fila => {
        const nombre = fila.getAttribute('data-nombre');
        
        if (nombre.includes(texto)) {
          fila.style.display = ''; // Mostrar
        } else {
          fila.style.display = 'none'; // Ocultar
        }
      });
    }
    
    function abrirModalKit(kit = null) {
      document.getElementById('modal-kit-titulo').textContent = kit ? 'Editar Kit' : 'Nuevo Kit';
      document.getElementById('kit-id').value = kit?.id || '';
      document.getElementById('kit-nombre').value = kit?.nombre || '';
      document.getElementById('kit-descripcion').value = kit?.descripcion || '';
      document.getElementById('kit-imagen').value = kit?.imagen_portada || '';
      document.getElementById('kit-activo').checked = kit?.activo !== false;
      
      document.getElementById('modal-kit').classList.add('is-open');
    }

    function cerrarModalKit() {
      document.getElementById('modal-kit').classList.remove('is-open');
      document.getElementById('form-kit').reset();
    }

    document.getElementById('form-kit').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('kit-id').value;
      
      const data = {
        nombre: document.getElementById('kit-nombre').value,
        descripcion: document.getElementById('kit-descripcion').value,
        imagen_portada: document.getElementById('kit-imagen').value,
        activo: document.getElementById('kit-activo').checked
      };
      
      if (id) {
        await supabaseClient.from('kits').update(data).eq('id', id);
      } else {
        await supabaseClient.from('kits').insert([data]);
      }
      
      cerrarModalKit();
      cargarKits();
    });

    async function editarKit(id) { 
      abrirModalKit(kitsAdmin.find(k => k.id === id)); 
    }
    
    async function eliminarKit(id) { 
      if (confirm('¿Eliminar este kit? (No borrará los productos, pero quedarán ocultos)')) { 
        await supabaseClient.from('kits').update({ activo: false }).eq('id', id); 
        cargarKits(); 
      } 
    }

function abrirModalCategoria(id = null, nombre = '', icono = 'fa-tag') {
  Swal.fire({
    title: id ? 'Editar Categoría' : 'Nueva Categoría',
    html: `
      <input id="cat-nombre" class="swal2-input" placeholder="Nombre (Ej: Sensores)" value="${nombre}">
      <input id="cat-icono" class="swal2-input" placeholder="Icono FontAwesome (Ej: fa-microchip)" value="${icono}">
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 10px;">Buscá iconos en <a href="https://fontawesome.com/icons" target="_blank">fontawesome.com/icons</a></p>
    `,
    showCancelButton: true,
    confirmButtonText: 'Guardar',
    cancelButtonText: 'Cancelar',
    confirmButtonColor: 'var(--blue)',
    preConfirm: () => {
      const nombre = document.getElementById('cat-nombre').value.trim();
      const icono = document.getElementById('cat-icono').value.trim();
      if (!nombre) {
        Swal.showValidationMessage('El nombre es obligatorio');
        return false;
      }
      return { nombre, icono };
    }
  }).then(async (result) => {
    if (result.isConfirmed) {
      const { nombre, icono } = result.value;
      if (id) {
        await supabaseClient.from('categorias').update({ nombre, icono }).eq('id', id);
      } else {
        await supabaseClient.from('categorias').insert([{ nombre, icono }]);
      }
      cargarCategorias();
    }
  });
}

function editarCategoria(id, nombre, icono) {
  abrirModalCategoria(id, nombre, icono);
}

async function eliminarCategoria(id) {
  const result = await Swal.fire({
    title: '¿Eliminar categoría?',
    text: 'Los productos de esta categoría no se eliminarán, pero quedarán sin categoría.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Sí, eliminar',
    cancelButtonText: 'Cancelar'
  });
  if (result.isConfirmed) {
    await supabaseClient.from('categorias').delete().eq('id', id);
    cargarCategorias();
  }
}
